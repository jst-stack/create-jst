name: Released artifact canary

on:
  workflow_dispatch:
  schedule:
    - cron: '19 6 * * 1'

permissions:
  contents: read

jobs:
  create:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        package-manager: [npm, pnpm]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - if: ${{ matrix.package-manager == 'pnpm' }}
        run: npm install --global pnpm@10
      - run: npm create jst@0.4.0 canary-app -- --yes --no-git --package-manager ${{ matrix.package-manager }}
      - run: ${{ matrix.package-manager }} run check
        working-directory: canary-app
