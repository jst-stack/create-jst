name: Released artifact canary

on:
  workflow_dispatch:
  schedule:
    - cron: '19 6 * * 1'

permissions:
  contents: read

jobs:
  create:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        package-manager: [npm, pnpm]
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - if: ${{ matrix.package-manager == 'pnpm' }}
        run: npm install --global pnpm@10.12.0
      - run: npm create jst@latest canary-app -- --yes --no-git --package-manager ${{ matrix.package-manager }}
      - run: ${{ matrix.package-manager }} run check
        working-directory: canary-app

  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
      - run: npm create jst@latest canary-app -- --yes --no-git --package-manager npm --example showcase
      - run: npm run check
        working-directory: canary-app

  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - if: ${{ matrix.package-manager == 'pnpm' }}
        run: npm install --global pnpm@10.12.0
      - run: node scripts/migration-canary.mjs
        env:
          JST_TEST_PACKAGE_MANAGER: ${{ matrix.package-manager }}
