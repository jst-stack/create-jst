name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      generated-matrix: ${{ steps.scope.outputs.generated-matrix }}
      verify-matrix: ${{ steps.scope.outputs.verify-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          full=false
          while IFS= read -r file; do
            case "$file" in
              CHANGELOG.md|package.json|package-lock.json|src/domain/projectSpecification.mjs) ;;
              *) full=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "full=$full" >> "$GITHUB_OUTPUT"
          if [ "$full" = true ]; then
            echo 'verify-matrix={"include":[{"os":"ubuntu-latest","node":"22.14.0"},{"os":"ubuntu-latest","node":"24.15.0"},{"os":"macos-latest","node":"22.14.0"},{"os":"macos-latest","node":"24.15.0"},{"os":"windows-latest","node":"22.14.0"},{"os":"windows-latest","node":"24.15.0"}]}' >> "$GITHUB_OUTPUT"
            echo 'generated-matrix={"include":[{"os":"ubuntu-latest","package-manager":"npm"},{"os":"ubuntu-latest","package-manager":"pnpm"},{"os":"macos-latest","package-manager":"npm"},{"os":"windows-latest","package-manager":"pnpm"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'verify-matrix={"include":[{"os":"ubuntu-latest","node":"24.15.0"},{"os":"windows-latest","node":"24.15.0"}]}' >> "$GITHUB_OUTPUT"
            echo 'generated-matrix={"include":[{"os":"ubuntu-latest","package-manager":"npm"},{"os":"ubuntu-latest","package-manager":"pnpm"}]}' >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.verify-matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run check

  generated-project:
    name: generated project / ${{ matrix.os }} / ${{ matrix.package-manager }}
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.generated-matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - if: ${{ matrix.package-manager == 'pnpm' }}
        run: npm install --global pnpm@10.12.0
      - run: npm run test:generated
        env:
          JST_TEST_PACKAGE_MANAGER: ${{ matrix.package-manager }}

  showcase:
    name: showcase / ubuntu-latest / npm
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node src/cli.mjs canary-app --yes --no-git --package-manager npm --example showcase
      - run: npm run check
        working-directory: canary-app

  ci:
    name: ci
    if: ${{ always() }}
    needs: [changes, verify, generated-project, showcase]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation
        env:
          GENERATED_RESULT: ${{ needs.generated-project.result }}
          SHOWCASE_RESULT: ${{ needs.showcase.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          [ "$VERIFY_RESULT" = success ]
          [ "$GENERATED_RESULT" = success ]
          [ "$SHOWCASE_RESULT" = success ] || [ "$SHOWCASE_RESULT" = skipped ]
