name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci
      - run: npm run check
      - name: Verify tag matches package version
        run: >-
          node --input-type=module --eval
          "import manifest from './package.json' with { type: 'json' };
          if (process.env.GITHUB_REF_NAME !== 'v' + manifest.version) process.exit(1)"
      - name: Check whether the version is already published
        id: registry
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          npm view "$package_name@$package_version" version && echo "published=true" >> "$GITHUB_OUTPUT" || true
      - if: ${{ steps.registry.outputs.published != 'true' }}
        run: npm publish --provenance --access public
      - name: Verify the published package
        run: npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version dist.integrity dist.attestations
      - name: Create GitHub release
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
